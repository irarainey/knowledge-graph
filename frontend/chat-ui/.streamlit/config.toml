[server]
# Run without trying to open a browser (suitable for a dev container) and listen
# on all interfaces so the port can be forwarded.
headless = true
address = "0.0.0.0"
port = 8501

[browser]
# Don't prompt for an email on first run and don't phone home.
gatherUsageStats = false

[client]
# Hide the "Deploy" button and trim the toolbar to the essentials.
toolbarMode = "minimal"

[theme]
# Shared design language with the Vue graph renderer (frontend/graph-renderer/src/styles.css) so
# the two apps read as one product: dark slate base, amber accent, Inter font.
base = "dark"
primaryColor = "#e8a020"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans-serif"

