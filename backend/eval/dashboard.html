<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge Graph — Evaluation Dashboard</title>
  <style>
    :root {
      --bg: #0f1116;
      --panel: #1a1d27;
      --panel-2: #222633;
      --border: #2c3140;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #5b9dff;
      --good: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 13px; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    select, button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    label { color: var(--muted); font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .card .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
    section { margin-bottom: 32px; }
    section > h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--text); }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; background: var(--panel-2); }
    tr:last-child td { border-bottom: none; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .tag { display: inline-block; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--muted); margin-right: 4px; }
    .pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; }
    .pill.pass { background: rgba(63,185,80,.15); color: var(--good); }
    .pill.fail { background: rgba(248,81,73,.15); color: var(--bad); }
    details { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    details > summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] > summary { border-bottom: 1px solid var(--border); }
    .qbody { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .qbody .full { grid-column: 1 / -1; }
    .qbody .cmp { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .qbody h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; margin: 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    .q-summary { flex: 1; display: flex; gap: 12px; align-items: center; min-width: 0; }
    .q-summary .qtext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .muted { color: var(--muted); }
    .notice { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; color: var(--muted); }
    .notice code { color: var(--text); background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Knowledge Graph — Evaluation Dashboard</h1>
    <span class="sub" id="fileCount">Loading…</span>
  </header>
  <main>
    <div id="content"></div>
  </main>

  <script>
    const RESULTS_DIR = "results/";

    function pct(x) { return x == null ? "—" : (x * 100).toFixed(1) + "%"; }
    function num(x, d = 0) { return x == null ? "—" : Number(x).toFixed(d); }
    function ms(x) { return x == null ? "—" : Math.round(x).toLocaleString() + " ms"; }
    function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

    function metricColor(x) {
      if (x == null) return "var(--muted)";
      if (x >= 0.8) return "var(--good)";
      if (x >= 0.5) return "var(--warn)";
      return "var(--bad)";
    }

    // Discover result files. Try an index.json manifest first; fall back to
    // parsing a served directory listing (e.g. `python -m http.server`).
    async function discoverFiles() {
      try {
        const r = await fetch(RESULTS_DIR + "index.json", { cache: "no-store" });
        if (r.ok) {
          const list = await r.json();
          if (Array.isArray(list) && list.length) {
            return list.map(n => n.startsWith("http") || n.includes("/") ? n : RESULTS_DIR + n);
          }
        }
      } catch (_) { /* no manifest */ }

      const r = await fetch(RESULTS_DIR, { cache: "no-store" });
      if (!r.ok) throw new Error("Cannot list " + RESULTS_DIR);
      const html = await r.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const names = [...doc.querySelectorAll("a[href]")]
        .map(a => a.getAttribute("href"))
        .filter(h => /eval-.*\.json$/.test(h) || /\.json$/.test(h) && !/index\.json$/.test(h))
        .map(h => h.startsWith(RESULTS_DIR) || h.includes("/") ? h : RESULTS_DIR + h);
      return [...new Set(names)];
    }

    async function loadAll() {
      const files = await discoverFiles();
      const runs = [];
      for (const f of files) {
        try {
          const r = await fetch(f, { cache: "no-store" });
          if (!r.ok) continue;
          const data = await r.json();
          runs.push({ file: f.split("/").pop(), data });
        } catch (_) { /* skip bad file */ }
      }
      runs.sort((a, b) => (a.data.run?.timestamp || "").localeCompare(b.data.run?.timestamp || ""));
      return runs;
    }

    function card(k, v, color) {
      return `<div class="card"><div class="k">${k}</div><div class="v" ${color ? `style="color:${color}"` : ""}>${v}</div></div>`;
    }

    // Drop keys whose value is null/undefined, an empty array, or an empty object so the
    // displayed intent shows only the parts the model actually set (no "fields: [],
    // filters: [], limit: null" noise). Recurses into nested objects/arrays.
    function pruneEmpty(value) {
      if (Array.isArray(value)) {
        const arr = value.map(pruneEmpty).filter(v => !isEmpty(v));
        return arr;
      }
      if (value && typeof value === "object") {
        const out = {};
        for (const [k, v] of Object.entries(value)) {
          const pv = pruneEmpty(v);
          if (!isEmpty(pv)) out[k] = pv;
        }
        return out;
      }
      return value;
    }

    function isEmpty(v) {
      return v == null
        || (Array.isArray(v) && v.length === 0)
        || (typeof v === "object" && Object.keys(v).length === 0);
    }

    // A single-element array displays as the bare object (drop the [ ] wrapper).
    function unwrapSingle(v) {
      return Array.isArray(v) && v.length === 1 ? v[0] : v;
    }

    function renderSummary(run) {
      const s = run.data.summary || {};
      const meta = run.data.run || {};
      const cards = [
        card("Questions", s.question_count ?? "—"),
        card("Pass rate", pct(s.pass_rate), metricColor(s.pass_rate)),
        card("Output values", pct(s.output_value_accuracy), metricColor(s.output_value_accuracy)),
        card("Output precision", pct(s.output_precision_macro), metricColor(s.output_precision_macro)),
        card("Output recall", pct(s.output_recall_macro), metricColor(s.output_recall_macro)),
        card("Output F1", pct(s.output_f1_macro), metricColor(s.output_f1_macro)),
        card("Over-fetch cases", (s.overfetch_count ?? 0), s.overfetch_count ? "var(--bad)" : "var(--good)"),
        card("Query valid", pct(s.query_valid_rate), metricColor(s.query_valid_rate)),
        card("Empty retrieval", pct(s.empty_retrieval_rate), s.empty_retrieval_rate ? "var(--bad)" : "var(--good)"),
        card("Tool selection", pct(s.tool_selection_accuracy), metricColor(s.tool_selection_accuracy)),
        card("Intent selection", pct(s.intent_selection_accuracy), metricColor(s.intent_selection_accuracy)),
        card("Document select", pct(s.document_selection_accuracy), metricColor(s.document_selection_accuracy)),
        card("Document fetch", pct(s.document_fetch_rate), metricColor(s.document_fetch_rate)),
        card("Refusal correct", pct(s.refusal_correct_rate), metricColor(s.refusal_correct_rate)),
        card("Forbidden leaks", (s.forbidden_leak_count ?? 0), s.forbidden_leak_count ? "var(--bad)" : "var(--good)"),
      ].join("");
      return `<section>
        <h2>Run summary <span class="muted" style="font-weight:400">— ${esc(meta.timestamp || "")} · model ${esc(meta.model || "?")}</span></h2>
        <div class="grid">${cards}</div>
      </section>`;
    }

    function renderQuestions(run) {
      const qs = run.data.questions || [];
      const items = qs.map(q => {
        const cost = q.cost || {};
        const pill = q.passed ? `<span class="pill pass">PASS</span>` : `<span class="pill fail">FAIL</span>`;
        const errRow = q.error ? `<div class="full"><h4>Error</h4><pre style="color:var(--bad)">${esc(q.error)}</pre></div>` : "";
        const overfetch = (q.unexpected_output_rows || []).length;

        // Comparison panels: expected on the LEFT, the agent's actual output on the RIGHT,
        // each pair aligned on its own row for easy side-by-side reading.
        const panel = (title, body) => `<div><h4>${title}</h4><pre>${body}</pre></div>`;
        const cmp = (left, right) => `<div class="cmp">${left}${right}</div>`;
        const actualRows = (q.records && q.records.length) ? esc(JSON.stringify(q.records, null, 2)) : "(no rows returned)";
        const rowCount = `<span class="muted" style="font-weight:400">(${q.predicted_record_count ?? 0})</span>`;

        const cmpPanels = [];
        if (q.expected_intent || (q.intents_used && q.intents_used.length)) {
          cmpPanels.push(cmp(
            panel("Expected intent", esc(q.expected_intent ? JSON.stringify(pruneEmpty(q.expected_intent), null, 2) : "")),
            panel("Intent used", esc((q.intents_used && q.intents_used.length) ? JSON.stringify(unwrapSingle(pruneEmpty(q.intents_used)), null, 2) : "")),
          ));
        }
        if (q.expected_output_rows && q.expected_output_rows.length) {
          const exp = esc(JSON.stringify(q.expected_output_rows, null, 2))
            + ((q.missing_output_rows && q.missing_output_rows.length) ? "\n" + esc("missing: " + JSON.stringify(q.missing_output_rows)) : "")
            + ((q.unexpected_output_rows && q.unexpected_output_rows.length) ? "\n" + esc("over-fetched: " + JSON.stringify(q.unexpected_output_rows)) : "");
          cmpPanels.push(cmp(panel("Expected output rows", exp), panel(`Actual output rows ${rowCount}`, actualRows)));
        }
        if (q.expected_output_fields && Object.keys(q.expected_output_fields).length) {
          const exp = esc(JSON.stringify(q.expected_output_fields, null, 2))
            + ((q.missing_output_fields && Object.keys(q.missing_output_fields).length) ? "\n" + esc("missing: " + JSON.stringify(q.missing_output_fields)) : "");
          cmpPanels.push(cmp(panel("Expected output fields", exp), panel(`Actual output rows ${rowCount}`, actualRows)));
        }
        if ((q.expected_output_values && q.expected_output_values.length) || (q.documents_used && q.documents_used.length)) {
          const exp = esc((q.expected_output_values && q.expected_output_values.length) ? q.expected_output_values.join(", ") : "")
            + ((q.present_output_values && q.present_output_values.length) ? "\n" + esc("found: " + q.present_output_values.join(", ")) : "")
            + ((q.missing_output_values && q.missing_output_values.length) ? "\n" + esc("missing: " + q.missing_output_values.join(", ")) : "");
          const docTitle = "Document selected" + (q.expected_document_id ? " (expected " + esc(q.expected_document_id) + ")" : "");
          const selected = (q.documents_used && q.documents_used.length) ? q.documents_used.join(", ") : "(none)";
          const body = (q.document_content && q.document_content.length)
            ? esc(selected) + "\n\n" + esc(q.document_content)
            : esc(selected) + "\n\n(no content returned)";
          const docPanel = `<div><h4>${docTitle}</h4><pre style="max-height:320px;overflow:auto">${body}</pre></div>`;
          cmpPanels.push(cmp(
            panel("Expected content values", exp),
            docPanel,
          ));
        }

        return `<details>
          <summary>
            ${pill}
            <span class="q-summary">
              <span class="qtext"><strong>${esc(q.id)}</strong> · ${esc(q.question)}</span>
            </span>
            <span class="muted" style="font-variant-numeric:tabular-nums">${esc(q.mode || "—")}</span>
          </summary>
          <div class="qbody">
            <div>
              <h4>Retrieval</h4>
              <table style="border:none">
                <tr><td class="muted">Output values</td><td class="num">${q.output_values_ok == null ? "—" : (q.output_values_ok ? "ok" : "BAD")}</td></tr>
                <tr><td class="muted">Precision / Recall / F1</td><td class="num">${q.output_f1 == null ? "—" : `${pct(q.output_precision)} / ${pct(q.output_recall)} / ${pct(q.output_f1)}`}</td></tr>
                <tr><td class="muted">TP / FP / FN</td><td class="num">${q.output_f1 == null ? "—" : `${q.output_tp} / ${q.output_fp} / ${q.output_fn}`}</td></tr>
                <tr><td class="muted">Exact output</td><td class="num">${q.exact_output ? "yes" : "no"}</td></tr>
                <tr><td class="muted">Over-fetched rows</td><td class="num" ${overfetch ? `style="color:var(--bad)"` : ""}>${overfetch}</td></tr>
                <tr><td class="muted">Predicted rows</td><td class="num">${q.predicted_record_count ?? "—"}</td></tr>
                <tr><td class="muted">Empty retrieval</td><td class="num">${q.empty_retrieval ? "yes" : "no"}</td></tr>
                <tr><td class="muted">Query valid</td><td class="num">${q.query_valid ? "yes" : "no"}</td></tr>
              </table>
            </div>
            <div>
              <h4>Tools, authorization & cost</h4>
              <table style="border:none">
                <tr><td class="muted">Mode</td><td class="num">${esc(q.mode || "—")}</td></tr>
                <tr><td class="muted">Tools used</td><td class="num">${esc((q.tools_used || []).join(", ") || "—")}</td></tr>
                <tr><td class="muted">Tool selection</td><td class="num">${q.tool_selection_ok == null ? "—" : (q.tool_selection_ok ? "ok" : "BAD")}</td></tr>
                <tr><td class="muted">Intent selection</td><td class="num">${q.intent_selection_ok == null ? "—" : (q.intent_selection_ok ? "ok" : "BAD")}</td></tr>
                <tr><td class="muted">Output values</td><td class="num">${q.output_values_ok == null ? "—" : (q.output_values_ok ? "ok" : "BAD")}</td></tr>
                <tr><td class="muted">Document selection</td><td class="num">${q.document_id_ok == null ? "—" : (q.document_id_ok ? "ok" : "BAD")}</td></tr>
                <tr><td class="muted">Refused</td><td class="num">${q.refused ? "yes" : "no"}</td></tr>
                <tr><td class="muted">Forbidden leaks</td><td class="num">${(q.leaked_values || []).length}</td></tr>
                <tr><td class="muted">LLM calls</td><td class="num">${cost.llm_calls ?? "—"}</td></tr>
                <tr><td class="muted">Tokens</td><td class="num">${(cost.tokens?.total ?? 0).toLocaleString()}</td></tr>
                <tr><td class="muted">Latency</td><td class="num">${ms(cost.durations_ms?.total)}</td></tr>
              </table>
            </div>
            <div class="full"><h4>Generated query</h4><pre>${esc(q.generated_query || "")}</pre></div>
            ${cmpPanels.join("")}
            <div class="full"><h4>Answer <span class="muted" style="font-weight:400">(not scored)</span></h4><pre>${esc(q.answer_text || "")}</pre></div>
            ${errRow}
          </div>
        </details>`;
      }).join("");
      return `<section><h2>Questions (${qs.length})</h2>${items}</section>`;
    }

    function render(runs, idx) {
      const run = runs[idx];
      const options = runs.map((r, i) => {
        const s = r.data.summary || {};
        const label = `${r.data.run?.timestamp || r.file} — output ${pct(s.output_value_accuracy)}, pass ${pct(s.pass_rate)}`;
        return `<option value="${i}" ${i === idx ? "selected" : ""}>${esc(label)}</option>`;
      }).join("");

      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="controls">
          <label for="runSel">Run</label>
          <select id="runSel">${options}</select>
        </div>
        ${renderSummary(run)}
        ${renderQuestions(run)}
      `;
      document.getElementById("runSel").addEventListener("change", e => render(runs, Number(e.target.value)));
    }

    (async function () {
      const fc = document.getElementById("fileCount");
      try {
        const runs = await loadAll();
        if (!runs.length) {
          fc.textContent = "No result files found";
          document.getElementById("content").innerHTML = `<div class="notice">
            No evaluation results found in <code>${RESULTS_DIR}</code>.<br><br>
            Generate results with <code>uv run poe evaluate</code>, then serve this folder so the dashboard can read them:<br><br>
            <code>cd backend/eval &amp;&amp; python -m http.server 8000</code><br>
            and open <a href="http://localhost:8000/dashboard.html">http://localhost:8000/dashboard.html</a>.
          </div>`;
          return;
        }
        fc.textContent = `${runs.length} run${runs.length === 1 ? "" : "s"} loaded · latest first in selector`;
        render(runs, runs.length - 1);
      } catch (err) {
        fc.textContent = "Failed to load results";
        document.getElementById("content").innerHTML = `<div class="notice">
          Could not read <code>${RESULTS_DIR}</code> (${esc(err.message)}).<br><br>
          Opening this file directly via <code>file://</code> cannot list the results directory.
          Serve the folder instead:<br><br>
          <code>cd backend/eval &amp;&amp; python -m http.server 8000</code><br>
          then open <a href="http://localhost:8000/dashboard.html">http://localhost:8000/dashboard.html</a>.
        </div>`;
      }
    })();
  </script>
</body>
</html>
