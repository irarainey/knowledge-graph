<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge Graph — Evaluation Dashboard</title>
  <style>
    :root {
      --bg: #0f1116;
      --panel: #1a1d27;
      --panel-2: #222633;
      --border: #2c3140;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #5b9dff;
      --good: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 13px; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    select, button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    label { color: var(--muted); font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .card .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
    section { margin-bottom: 32px; }
    section > h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--text); }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; background: var(--panel-2); }
    tr:last-child td { border-bottom: none; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .tag { display: inline-block; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--muted); margin-right: 4px; }
    .pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; }
    .pill.pass { background: rgba(63,185,80,.15); color: var(--good); }
    .pill.fail { background: rgba(248,81,73,.15); color: var(--bad); }
    .bar { position: relative; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; min-width: 60px; }
    .bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
    details { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    details > summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] > summary { border-bottom: 1px solid var(--border); }
    .qbody { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .qbody .full { grid-column: 1 / -1; }
    .qbody h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; margin: 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    .q-summary { flex: 1; display: flex; gap: 12px; align-items: center; min-width: 0; }
    .q-summary .qtext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .muted { color: var(--muted); }
    .trend { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .legend span::before { content: "■"; margin-right: 5px; }
    .notice { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; color: var(--muted); }
    .notice code { color: var(--text); background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Knowledge Graph — Evaluation Dashboard</h1>
    <span class="sub" id="fileCount">Loading…</span>
  </header>
  <main>
    <div id="content"></div>
  </main>

  <script>
    const RESULTS_DIR = "results/";

    function pct(x) { return x == null ? "—" : (x * 100).toFixed(1) + "%"; }
    function num(x, d = 0) { return x == null ? "—" : Number(x).toFixed(d); }
    function ms(x) { return x == null ? "—" : Math.round(x).toLocaleString() + " ms"; }
    function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

    function metricColor(x) {
      if (x == null) return "var(--muted)";
      if (x >= 0.8) return "var(--good)";
      if (x >= 0.5) return "var(--warn)";
      return "var(--bad)";
    }

    // Discover result files. Try an index.json manifest first; fall back to
    // parsing a served directory listing (e.g. `python -m http.server`).
    async function discoverFiles() {
      try {
        const r = await fetch(RESULTS_DIR + "index.json", { cache: "no-store" });
        if (r.ok) {
          const list = await r.json();
          if (Array.isArray(list) && list.length) {
            return list.map(n => n.startsWith("http") || n.includes("/") ? n : RESULTS_DIR + n);
          }
        }
      } catch (_) { /* no manifest */ }

      const r = await fetch(RESULTS_DIR, { cache: "no-store" });
      if (!r.ok) throw new Error("Cannot list " + RESULTS_DIR);
      const html = await r.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const names = [...doc.querySelectorAll("a[href]")]
        .map(a => a.getAttribute("href"))
        .filter(h => /eval-.*\.json$/.test(h) || /\.json$/.test(h) && !/index\.json$/.test(h))
        .map(h => h.startsWith(RESULTS_DIR) || h.includes("/") ? h : RESULTS_DIR + h);
      return [...new Set(names)];
    }

    async function loadAll() {
      const files = await discoverFiles();
      const runs = [];
      for (const f of files) {
        try {
          const r = await fetch(f, { cache: "no-store" });
          if (!r.ok) continue;
          const data = await r.json();
          runs.push({ file: f.split("/").pop(), data });
        } catch (_) { /* skip bad file */ }
      }
      runs.sort((a, b) => (a.data.run?.timestamp || "").localeCompare(b.data.run?.timestamp || ""));
      return runs;
    }

    function sparkline(values, color) {
      const w = 100, h = 28, pad = 2;
      const vals = values.map(v => v == null ? 0 : v);
      if (!vals.length) return "";
      const min = 0, max = 1;
      const pts = vals.map((v, i) => {
        const x = vals.length === 1 ? w / 2 : pad + (i / (vals.length - 1)) * (w - 2 * pad);
        const y = h - pad - ((v - min) / (max - min)) * (h - 2 * pad);
        return [x, y];
      });
      const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" fill="${color}"/>`).join("");
      return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none">
        <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5"/>${dots}</svg>`;
    }

    function renderTrend(runs) {
      if (runs.length < 2) return "";
      const series = [
        { key: "pass_rate", label: "Pass rate", color: "var(--good)" },
        { key: "mean_f1", label: "Mean F1", color: "var(--accent)" },
        { key: "mean_answer_coverage", label: "Answer coverage", color: "var(--warn)" },
        { key: "cypher_valid_rate", label: "Cypher valid", color: "#a371f7" },
      ];
      const rows = series.map(s => {
        const vals = runs.map(r => r.data.summary?.[s.key] ?? null);
        const last = vals[vals.length - 1];
        return `<tr>
          <td><span style="color:${s.color}">■</span> ${s.label}</td>
          <td>${sparkline(vals, s.color)}</td>
          <td class="num" style="color:${metricColor(last)}">${pct(last)}</td>
        </tr>`;
      }).join("");
      return `<section>
        <h2>Trend across ${runs.length} runs</h2>
        <div class="trend">
          <table style="border:none">
            <thead><tr><th>Metric</th><th>History</th><th class="num">Latest</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="legend muted">Oldest → newest, left to right. Scale 0–100%.</div>
        </div>
      </section>`;
    }

    function card(k, v, color) {
      return `<div class="card"><div class="k">${k}</div><div class="v" ${color ? `style="color:${color}"` : ""}>${v}</div></div>`;
    }

    function renderSummary(run) {
      const s = run.data.summary || {};
      const meta = run.data.run || {};
      const cards = [
        card("Questions", s.question_count ?? "—"),
        card("Pass rate", pct(s.pass_rate), metricColor(s.pass_rate)),
        card("Mean F1", pct(s.mean_f1), metricColor(s.mean_f1)),
        card("Mean precision", pct(s.mean_precision), metricColor(s.mean_precision)),
        card("Mean recall", pct(s.mean_recall), metricColor(s.mean_recall)),
        card("Exact match", pct(s.exact_match_rate), metricColor(s.exact_match_rate)),
        card("Cypher valid", pct(s.cypher_valid_rate), metricColor(s.cypher_valid_rate)),
        card("Empty retrieval", pct(s.empty_retrieval_rate), s.empty_retrieval_rate ? "var(--bad)" : "var(--good)"),
        card("Answer coverage", pct(s.mean_answer_coverage), metricColor(s.mean_answer_coverage)),
        card("Answer groundedness", pct(s.mean_answer_groundedness), metricColor(s.mean_answer_groundedness)),
        card("Total tokens", (s.total_tokens ?? 0).toLocaleString()),
        card("Mean latency", ms(s.mean_latency_ms)),
      ].join("");
      return `<section>
        <h2>Run summary <span class="muted" style="font-weight:400">— ${esc(meta.timestamp || "")} · model ${esc(meta.model || "?")} · F1 threshold ${meta.f1_threshold ?? "?"}</span></h2>
        <div class="grid">${cards}</div>
      </section>`;
    }

    function renderByTag(run) {
      const byTag = run.data.by_tag || {};
      const tags = Object.keys(byTag).sort();
      if (!tags.length) return "";
      const rows = tags.map(t => {
        const m = byTag[t];
        return `<tr>
          <td><span class="tag">${esc(t)}</span></td>
          <td class="num">${m.question_count}</td>
          <td class="num" style="color:${metricColor(m.pass_rate)}">${pct(m.pass_rate)}</td>
          <td class="num" style="color:${metricColor(m.mean_f1)}">${pct(m.mean_f1)}</td>
          <td class="num" style="color:${metricColor(m.mean_precision)}">${pct(m.mean_precision)}</td>
          <td class="num" style="color:${metricColor(m.mean_recall)}">${pct(m.mean_recall)}</td>
          <td class="num" style="color:${metricColor(m.mean_answer_coverage)}">${pct(m.mean_answer_coverage)}</td>
          <td class="num">${ms(m.mean_latency_ms)}</td>
        </tr>`;
      }).join("");
      return `<section>
        <h2>By tag</h2>
        <table>
          <thead><tr><th>Tag</th><th class="num">Q</th><th class="num">Pass</th><th class="num">F1</th><th class="num">Precision</th><th class="num">Recall</th><th class="num">Coverage</th><th class="num">Latency</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>`;
    }

    function bar(x) {
      const c = metricColor(x);
      const w = x == null ? 0 : Math.round(x * 100);
      return `<div class="bar"><span style="width:${w}%;background:${c}"></span></div>`;
    }

    function renderQuestions(run) {
      const qs = run.data.questions || [];
      const items = qs.map(q => {
        const ret = q.retrieval || {};
        const ans = q.answer || {};
        const cost = q.cost || {};
        const tags = (q.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
        const pill = q.passed ? `<span class="pill pass">PASS</span>` : `<span class="pill fail">FAIL</span>`;
        const errRow = q.error ? `<div class="full"><h4>Error</h4><pre style="color:var(--bad)">${esc(q.error)}</pre></div>` : "";
        return `<details>
          <summary>
            ${pill}
            <span class="q-summary">
              <span class="qtext"><strong>${esc(q.id)}</strong> · ${esc(q.question)}</span>
            </span>
            <span class="muted" style="font-variant-numeric:tabular-nums">F1 ${pct(ret.f1)}</span>
            ${bar(ret.f1)}
          </summary>
          <div class="qbody">
            <div>
              <h4>Retrieval</h4>
              <table style="border:none">
                <tr><td class="muted">Precision</td><td class="num">${pct(ret.precision)}</td></tr>
                <tr><td class="muted">Recall</td><td class="num">${pct(ret.recall)}</td></tr>
                <tr><td class="muted">F1</td><td class="num">${pct(ret.f1)}</td></tr>
                <tr><td class="muted">Jaccard</td><td class="num">${pct(ret.jaccard)}</td></tr>
                <tr><td class="muted">Exact match</td><td class="num">${ret.exact_match ? "yes" : "no"}</td></tr>
                <tr><td class="muted">Strict exact</td><td class="num">${ret.strict_exact_match ? "yes" : "no"}</td></tr>
                <tr><td class="muted">Gold / predicted rows</td><td class="num">${q.gold_record_count ?? "—"} / ${q.predicted_record_count ?? "—"}</td></tr>
                <tr><td class="muted">Cypher valid</td><td class="num">${q.cypher_valid ? "yes" : "no"}</td></tr>
              </table>
            </div>
            <div>
              <h4>Answer & cost</h4>
              <table style="border:none">
                <tr><td class="muted">Coverage</td><td class="num">${pct(ans.coverage)}</td></tr>
                <tr><td class="muted">Groundedness</td><td class="num">${pct(ans.groundedness)}</td></tr>
                <tr><td class="muted">Missing values</td><td class="num">${(ans.missing || []).length}</td></tr>
                <tr><td class="muted">LLM calls</td><td class="num">${cost.llm_calls ?? "—"}</td></tr>
                <tr><td class="muted">Tokens</td><td class="num">${(cost.tokens?.total ?? 0).toLocaleString()}</td></tr>
                <tr><td class="muted">Latency</td><td class="num">${ms(cost.durations_ms?.total)}</td></tr>
              </table>
            </div>
            <div class="full"><h4>Answer</h4><pre>${esc(ans.text || "")}</pre></div>
            <div><h4>Gold Cypher</h4><pre>${esc(q.gold_cypher || "")}</pre></div>
            <div><h4>Generated Cypher</h4><pre>${esc(q.generated_cypher || "")}</pre></div>
            ${errRow}
          </div>
        </details>`;
      }).join("");
      return `<section><h2>Questions (${qs.length})</h2>${items}</section>`;
    }

    function render(runs, idx) {
      const run = runs[idx];
      const options = runs.map((r, i) => {
        const s = r.data.summary || {};
        const label = `${r.data.run?.timestamp || r.file} — F1 ${pct(s.mean_f1)}, pass ${pct(s.pass_rate)}`;
        return `<option value="${i}" ${i === idx ? "selected" : ""}>${esc(label)}</option>`;
      }).join("");

      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="controls">
          <label for="runSel">Run</label>
          <select id="runSel">${options}</select>
        </div>
        ${renderTrend(runs)}
        ${renderSummary(run)}
        ${renderByTag(run)}
        ${renderQuestions(run)}
      `;
      document.getElementById("runSel").addEventListener("change", e => render(runs, Number(e.target.value)));
    }

    (async function () {
      const fc = document.getElementById("fileCount");
      try {
        const runs = await loadAll();
        if (!runs.length) {
          fc.textContent = "No result files found";
          document.getElementById("content").innerHTML = `<div class="notice">
            No evaluation results found in <code>${RESULTS_DIR}</code>.<br><br>
            Generate results with <code>uv run poe evaluate</code>, then serve this folder so the dashboard can read them:<br><br>
            <code>cd backend/eval &amp;&amp; python -m http.server 8000</code><br>
            and open <a href="http://localhost:8000/dashboard.html">http://localhost:8000/dashboard.html</a>.
          </div>`;
          return;
        }
        fc.textContent = `${runs.length} run${runs.length === 1 ? "" : "s"} loaded · latest first in selector`;
        render(runs, runs.length - 1);
      } catch (err) {
        fc.textContent = "Failed to load results";
        document.getElementById("content").innerHTML = `<div class="notice">
          Could not read <code>${RESULTS_DIR}</code> (${esc(err.message)}).<br><br>
          Opening this file directly via <code>file://</code> cannot list the results directory.
          Serve the folder instead:<br><br>
          <code>cd backend/eval &amp;&amp; python -m http.server 8000</code><br>
          then open <a href="http://localhost:8000/dashboard.html">http://localhost:8000/dashboard.html</a>.
        </div>`;
      }
    })();
  </script>
</body>
</html>
