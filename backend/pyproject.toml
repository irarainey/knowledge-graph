[project]
name = "backend"
version = "1.0.0"
description = "Python backend for Knowledge Graph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.42.0",
    "neo4j-graphrag>=1.17.0",
    "openai>=2.0,<3",
    "python-dotenv>=1.2.2",
    "neo4j>=6.2.0",
    "agent-framework-core>=1.7.0",
    "agent-framework-openai>=1.7.0",
    "azure-monitor-opentelemetry>=1.8.8",
]

[dependency-groups]
dev = [
    "poethepoet>=0.42.1",
    "mypy>=1.20.0",
    "ruff>=0.15.9",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0,<1.0",
]

[tool.uv]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Poe tasks ───────────────────────────────────────────────────

[tool.poe.tasks]

[tool.poe.tasks.lint]
help = "Run all linting (ruff check + mypy)"
sequence = ["lint:ruff", "lint:mypy"]

[tool.poe.tasks."lint:ruff"]
help = "Run ruff linter and formatter check"
sequence = [
    { cmd = "ruff check src/ scripts/ tests/" },
    { cmd = "ruff format --check src/ scripts/ tests/" },
]

[tool.poe.tasks."lint:mypy"]
help = "Run mypy type checking"
cmd = "mypy src/ scripts/ tests/"

[tool.poe.tasks.format]
help = "Auto-fix ruff lint issues and format code"
sequence = [
    { cmd = "ruff check --fix src/ scripts/ tests/" },
    { cmd = "ruff format src/ scripts/ tests/" },
]

[tool.poe.tasks.test]
help = "Run unit tests"
cmd = "pytest tests/ -v"

[tool.poe.tasks.import-graph]
help = "Import data/knowledge-graph.json into Neo4j (pass --clear to wipe first)"
cmd = "python scripts/import_graph.py"

[tool.poe.tasks.generate-ttl]
help = "Regenerate data/small_plane_ontology.ttl from data/knowledge-graph.json (pass --check to verify)"
cmd = "python scripts/generate_ttl.py"

[tool.poe.tasks.serve]
help = "Run the FastAPI query API with autoreload"
cmd = "uvicorn app:app --app-dir src --reload --host 0.0.0.0 --port 8080"

[tool.poe.tasks.dev]
help = "Run the backend API, Streamlit UI and Vue frontend together (Ctrl-C stops all)"
cmd = "bash ../scripts/start-dev.sh"

# ── Ruff ────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py313"
line-length = 140
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (flag bare prints)
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "T201",   # allow print() — used extensively in logger
    "SIM108", # allow if/else instead of ternary
    "RUF001", # ambiguous unicode in strings (intentional in LLM prompts)
    "RUF002", # ambiguous unicode in docstrings (en dashes, math symbols)
    "RUF003", # ambiguous unicode in comments (intentional)
    "N815",   # mixedCase in class scope (Pydantic models matching JSON API)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Pytest ──────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = []

# ── Mypy ────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["src", "tests"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

# ── Pyright / Pylance ───────────────────────────────────────────
# Both `src/` and `scripts/` are placed on sys.path at runtime (via the
# uv `--app-dir src` flag, the import-script bootstrap, and tests/conftest.py),
# so first-party modules are imported by their top-level names. Mirror that here
# so Pylance resolves imports like `import_graph`, `agents`, and `common`.
[tool.pyright]
extraPaths = ["src", "scripts"]
